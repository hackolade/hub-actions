name: Monitor demo environment

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  e2e-monitoring:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: hackolade.azurecr.io
          username: teamcity
          password: ${{ secrets.CICD_REGISTRY_TOKEN }}

      - name: Create directories for test results
        run: |
          mkdir -p test-results playwright-report

      - name: Run E2E tests against production
        id: run-e2e
        env:
          REGISTRY: hackolade.azurecr.io
          COMMIT_HASH: ${{ steps.commit.outputs.hash }}
          TARGET_ENVIRONMENT: "https://hub.hackolade.com"
          CI: "true"
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --pull always \
            -e CI \
            -e TARGET_ENVIRONMENT \
            -v "${{ github.workspace }}/test-results:/src/hub/test-results" \
            -v "${{ github.workspace }}/playwright-report:/src/hub/playwright-report" \
            --entrypoint npx \
            ${REGISTRY}/hub-e2e-tests:develop playwright test --project="chromium HUB" tests/e2e/hub/home/home.e2e.ts

      - name: Upload test results
        id: upload-test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright report
        id: upload-playwright-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-templated: true
          payload: |
            channel: ${{ secrets.SLACK_DEMO_MONITORING_CHANNEL_ID }}
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ":x: Demo Environment test failed"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Environment:*\nDemo (https://hub.hackolade.com)"
                  - type: mrkdwn
                    text: "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  - type: mrkdwn
                    text: "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Test results:*\n<${{ steps.upload-test-results.outputs.artifact-url }}|Download>"
                  - type: mrkdwn
                    text: "*Playwright report:*\n<${{ steps.upload-playwright-report.outputs.artifact-url }}|Download>"

